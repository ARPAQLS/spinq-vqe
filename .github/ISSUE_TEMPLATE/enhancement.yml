name: Enhancement
description: Improvement to existing functionality, performance, or API.
title: "enhance: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API / library interface
        - Performance (speed, memory)
        - Figures / visualization
        - Data pipeline
        - Install / packaging
        - CI / testing
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What would you like improved?
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why is this needed?
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: This is not a bug (use Bug Report) or new science (use Science template)
          required: true
