name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below to help us reproduce and fix the issue.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Numbered steps to reproduce the behavior.
      placeholder: |
        1. Run `...`
        2. Use `...`
        3. Observe `...`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened (include error messages if any).
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: "3.11.4"
  - type: input
    id: pennylane_version
    attributes:
      label: PennyLane version
      placeholder: "0.35.0"
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Ubuntu 22.04"
  - type: input
    id: spinq_version
    attributes:
      label: spinq-vqe version (commit/tag)
      placeholder: "v0.1.5"
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other details, screenshots, or logs.
