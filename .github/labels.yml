# Source of truth for repo labels. Synced on push to master by
# .github/workflows/sync-labels.yml (crazy-max/ghaction-github-labeler).
# Palette from issue #12. skip-delete is on, so default GitHub labels
# not listed here (duplicate, help wanted, …) are left in place.

- name: "bug"
  color: "EBD8DC"
  description: "Something is broken"
- name: "science"
  color: "C7E4CA"
  description: "New scientific analysis or result"
- name: "enhancement"
  color: "DBD3DC"
  description: "Improvement to existing functionality"
- name: "documentation"
  color: "F4ECC8"
  description: "Docs fixes or additions"
- name: "notebook"
  color: "F0D9CC"
  description: "Notebook-specific issue"
- name: "data"
  color: "D4E8F4"
  description: "Data pipeline or reproducibility"
- name: "test"
  color: "DCE8D4"
  description: "Test coverage"
- name: "ci"
  color: "E4DCF0"
  description: "CI/CD workflows"
- name: "chore"
  color: "EBEBEB"
  description: "Housekeeping, no functional change"
- name: "needs-triage"
  color: "F5E6D0"
  description: "Needs initial assessment"
- name: "needs-discussion"
  color: "F0ECD8"
  description: "Design decision required"
- name: "good first issue"
  color: "C7E4CA"
  description: "Good entry point for new contributors"
- name: "wontfix"
  color: "F0F0F0"
  description: "Out of scope or declined"
- name: "blocked"
  color: "EBD8DC"
  description: "Waiting on another issue"
- name: "kagome"
  color: "DBE8DC"
  description: "Kagome lattice / Hamiltonian specific"
- name: "vqe"
  color: "D8E4EB"
  description: "VQE algorithm specific"
- name: "qaoa"
  color: "E4D8EB"
  description: "QAOA / material selection specific"
- name: "entanglement"
  color: "EBE8D8"
  description: "Entanglement analysis specific"
- name: "dmrg"
  color: "D8EBE4"
  description: "DMRG comparison (TeNPy)"
- name: "nqs"
  color: "E8EBD8"
  description: "Neural Quantum States (NetKet)"
- name: "barren-plateau"
  color: "EBD8D8"
  description: "Barren plateau / gradient analysis"
- name: "materials-project"
  color: "D8E8EB"
  description: "Materials Project API / data"
- name: "publication"
  color: "F0D9CC"
  description: "Paper-related, pre-submission"
